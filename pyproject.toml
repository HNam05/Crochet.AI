[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-ai-compiler"
version = "0.1.0"
description = "Deterministic crochet compiler contracts and Milestone 0 validator"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crochet_ai = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["crochet_ai"]
